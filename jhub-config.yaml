
proxy:
  https:
    enabled: false
  # hosts:
  #   - mc-a4.lab.uvalight.net
  # pathSuffix: /jupyter(/|$)(.*)
  # pathType: ImplementationSpecific


hub:
  config:
    Spawner:
      http_timeout: 180
      start_timeout: 300
      post_stop_hook: |
        def post_stop_hook(spawner):
            import subprocess, os
            # Namespace is usually spawner.namespace
            ns = spawner.namespace
            outdir = "/mnt/data"
            # Call your exporter binary/script that's in the Hub container
            subprocess.Popen([
                "python3",
                "/usr/local/bin/export_scaphandre_metrics.py",
                "--namespace", ns,
                "--output-dir", outdir
            ])
    JupyterHub:
      baseUrl: "/jupyter"
      template_vars:
        announcement_login: 'If you do not have credentials to log in, please contact <a href="mailto:g.j.teixeiradepinhoferreira@uva.nl">g.j.teixeiradepinhoferreira@uva.nl</a>.'
      tornado_settings:
        xheaders: true
    JupyterHubCuller:
      enabled: true
      timeout: 3600 # 1 hour
      every: 6000 # 10 minutes
      concurrency: 10
    Authenticator:
      admin_users:
        - shashikant
        - yuri
        - adnan
        - quint
        - goncalo
    JupyterHub:
      authenticator_class: dummy

singleuser:
  image:
    name: jupyter/datascience-notebook
    tag: latest

  storage:
    type: dynamic
    capacity: 5Gi
    homeMountPath: /home/jovyan
    dynamic:
      storageClass: standard
      pvcNameTemplate: claim-{username}
      storageAccessModes:
        - ReadWriteOnce

    extraVolumes:
      - name: powercap
        hostPath:
          path: /sys/class/powercap
          type: Directory
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
      - name: nginx-config
        configMap:
          name: scaphandre-nginx-config
      - name: default-notebooks
        persistentVolumeClaim:
          claimName: pvc-default-notebooks

    extraVolumeMounts:
      # - name: export-script
      #   mountPath: /usr/local/bin/export_metrics.py
      #   subPath: export_metrics.py
      #   readOnly: true
      - name: powercap
        mountPath: /sys/class/powercap
      - name: proc
        mountPath: /proc
      - name: containerd-sock
        mountPath: /run/containerd/containerd.sock
        readOnly: true
      - name: default-notebooks
        mountPath: /home/jovyan/default-notebooks
        readOnly: false


  extraContainers:
    - name: scaphandre
      image: hubblo/scaphandre:latest
      args:
        - prometheus
        - "--address=0.0.0.0"
        - "--port=8080"
        - "--containers"
      ports:
        - name: rawmetrics
          containerPort: 8080

    - name: proxy-metrics
      image: nginx:stable-alpine
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      ports:
        - name: metrics
          containerPort: 8081
  
  uid: 0
  allowPrivilegeEscalation: true
  cmd:
    - bash
    - -c
    - |
      export PYTHONUSERBASE=/home/jovyan/.local
      export PIP_CACHE_DIR=/home/jovyan/.cache/pip
      export PIP_CONFIG_FILE=/home/jovyan/.config/pip/pip.conf
      export PATH=/home/jovyan/.local/bin:/home/jovyan/.bin:/home/jovyan/.cargo/bin:$PATH

      mkdir -p /home/jovyan/.local/bin /home/jovyan/.cache/pip /home/jovyan/.config/pip
      chown -R jovyan:users /home/jovyan/.local /home/jovyan/.cache /home/jovyan/.config
      printf '%s\n' \
        '[global]' \
        'user = true' \
        'cache-dir = /home/jovyan/.cache/pip' \
        > /home/jovyan/.config/pip/pip.conf
      chown jovyan:users /home/jovyan/.config/pip/pip.conf

      printf '%s\n' \
        'export PYTHONUSERBASE=/home/jovyan/.local' \
        'export PIP_CACHE_DIR=/home/jovyan/.cache/pip' \
        'export PIP_CONFIG_FILE=/home/jovyan/.config/pip/pip.conf' \
        'export PATH=/home/jovyan/.local/bin:/home/jovyan/.bin:/home/jovyan/.cargo/bin:$PATH' \
        > /etc/profile.d/jovyan-persistent-python.sh

      sudo -E -u jovyan /opt/conda/bin/python - <<'PY'
      import importlib.util
      import subprocess
      import sys

      packages = [
          ("prometheus_api_client", "prometheus_api_client"),
      ]
      missing = [package for module, package in packages if importlib.util.find_spec(module) is None]
      if missing:
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", *missing])
      PY

      exec start.sh jupyterhub-singleuser
  extraEnv:
    GRANT_SUDO: "1"
    NOTEBOOK_ARGS: "--allow-root"
    PYTHONUSERBASE: "/home/jovyan/.local"
    PIP_CACHE_DIR: "/home/jovyan/.cache/pip"
    PIP_CONFIG_FILE: "/home/jovyan/.config/pip/pip.conf"
