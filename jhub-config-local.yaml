proxy:
  https:
    enabled: false

hub:
  baseUrl: /lab/juvre/ # just in case we are sharing with other apps
  config:
    JupyterHubCuller:
      enabled: true
      timeout: 3600 # 1 hour
      every: 6000 # 10 minutes
      concurrency: 10
    Spawner:
      # First spawn downloads and installs the example dependencies.
      http_timeout: 1800
    Authenticator:
      admin_users: &admin_users
        - shashikant
        - yuri
        - adnan
        - goncalo
      # Demo accounts use the existing shared password, without Hub admin rights.
      allow_all: false
      allow_existing_users: false
      allowed_users:
        - shashikant
        - yuri
        - adnan
        - goncalo
        - user-1
        - user-2
        - user-3
        - user-4
        - user-5
        - user-6
    JupyterHub:
      authenticator_class: dummy
      tornado_settings:
        xheaders: true
      # Revoke any admin role retained by users removed from admin_users.
      load_roles:
        - name: admin
          users: *admin_users
  extraEnv:
    JHUB_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: hub-password-secret
          key: password
  extraConfig:
    00-dummy-password: |
      import os
      c.DummyAuthenticator.password = os.environ["JHUB_PASSWORD"]
    01-login-announcement: |
      c.JupyterHub.template_vars = {
          "announcement_login": (
              'If you do not have credentials to log in, please contact '
              '<a href="mailto:g.j.teixeiradepinhoferreira@uva.nl">'
              'g.j.teixeiradepinhoferreira@uva.nl</a>.'
          )
      }
    enable-api-accces: |
      c.KubeSpawner.automount_serviceaccount_token = True
    allow-root: |
      from kubespawner import KubeSpawner
      def modify_pod(spawner: KubeSpawner, pod):
          pod.spec.containers[0].security_context = {
              "runAsUser": 0,
              "runAsGroup": 0,
              "privileged": True,
              "allowPrivilegeEscalation": True,
              "capabilities": {
                  "add": ["ALL"]
              }
          }
          return pod
      c.KubeSpawner.modify_pod_hook = modify_pod
    # notebook-xorigin: |
    #   c.NotebookApp.allow_origin = '*'
    #   c.NotebookApp.disable_check_xsrf = True

singleuser:
  startTimeout: 1800
  # IceNet training shares the 20 GiB mc-a4 cluster with the control plane.
  memory:
    guarantee: 2G
    limit: 8G
  cpu:
    guarantee: 0.1
    limit: 1
  image:
    name: jupyter/datascience-notebook
    tag: latest
  
  extraEnv:
    GRANT_SUDO: "yes"
    NOTEBOOK_ARGS: "--allow-root"
    PYTHONUSERBASE: "/home/jovyan/.local"
    PIP_CACHE_DIR: "/home/jovyan/.cache/pip"
    PIP_CONFIG_FILE: "/home/jovyan/.config/pip/pip.conf"
    CARGO_BUILD_JOBS: "1"
    # JUPYTER_ALLOW_ORIGIN: "*"
    # JUPYTER_ENABLE_LAB: "yes"
    # JUPYTER_TOKEN: ""
    # JUPYTERHUB_SINGLEUSER_APP: "notebook"
    # JUPYTER_CONFIG_DIR: "/etc/jupyter"

  uid: 0
  fsGid: 0
  cmd:
    - bash
    - -c
    - |
      set -euo pipefail

      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        jq libhdf5-dev libnetcdf-dev libudunits2-0

      export PYTHONUSERBASE=/home/jovyan/.local
      export PIP_CACHE_DIR=/home/jovyan/.cache/pip
      export PIP_CONFIG_FILE=/home/jovyan/.config/pip/pip.conf
      export PATH=/home/jovyan/.local/bin:/home/jovyan/.bin:/home/jovyan/.cargo/bin:$PATH

      mkdir -p /home/jovyan/.local/bin /home/jovyan/.cache/pip /home/jovyan/.config/pip
      chown -R jovyan:users /home/jovyan/.local /home/jovyan/.cache /home/jovyan/.config
      printf '%s\n' \
        '[global]' \
        'user = true' \
        'cache-dir = /home/jovyan/.cache/pip' \
        > /home/jovyan/.config/pip/pip.conf
      chown jovyan:users /home/jovyan/.config/pip/pip.conf

      printf '%s\n' \
        'export PYTHONUSERBASE=/home/jovyan/.local' \
        'export PIP_CACHE_DIR=/home/jovyan/.cache/pip' \
        'export PIP_CONFIG_FILE=/home/jovyan/.config/pip/pip.conf' \
        'export PATH=/home/jovyan/.local/bin:/home/jovyan/.bin:/home/jovyan/.cargo/bin:$PATH' \
        > /etc/profile.d/jovyan-persistent-python.sh

      if [ ! -f /home/jovyan/GD_EcoJupyter_Tutorial.ipynb ]; then
        cp /srv/starter-notebooks/GD_EcoJupyter_Tutorial.ipynb /home/jovyan/GD_EcoJupyter_Tutorial.ipynb
      fi
      chmod 777 /home/jovyan/GD_EcoJupyter_Tutorial.ipynb

      if [ ! -f /home/jovyan/GD_EcoJupyter_StressTest.ipynb ] && [ -f /srv/stress-notebook/GD_EcoJupyter_StressTest.ipynb ]; then
        cp /srv/stress-notebook/GD_EcoJupyter_StressTest.ipynb /home/jovyan/GD_EcoJupyter_StressTest.ipynb
      fi
      if [ -f /home/jovyan/GD_EcoJupyter_StressTest.ipynb ]; then
        chmod 777 /home/jovyan/GD_EcoJupyter_StressTest.ipynb
      fi

      if [ ! -d /usr/local/etc/jupyter ]; then
        mkdir -p /usr/local/etc/jupyter
      fi

      if [ ! -f /usr/local/etc/jupyter/notebook_tracker_experimentid.py ]; then
        cp /srv/track-notebook/notebook_tracker_experimentid.py /usr/local/etc/jupyter/notebook_tracker_experimentid.py
      fi

      if ! grep -q "import notebook_tracker_experimentid" /usr/local/etc/jupyter/jupyter_server_config.py 2>/dev/null; then
        echo "import sys" >> /usr/local/etc/jupyter/jupyter_server_config.py
        echo "sys.path.append('/srv/track-notebook')" >> /usr/local/etc/jupyter/jupyter_server_config.py
        echo "import notebook_tracker_experimentid" >> /usr/local/etc/jupyter/jupyter_server_config.py
      fi

      # Apply the prebuilt installer override before server extensions load.
      if ! grep -q "import safe_telemetry" /usr/local/etc/jupyter/jupyter_server_config.py 2>/dev/null; then
        printf '%s\n' "import sys" "sys.path.insert(0, '/srv/telemetry-installer')" \
          "import safe_telemetry" >> /usr/local/etc/jupyter/jupyter_server_config.py
      fi

      # Keep Python packages on the user's persistent PVC.
      sudo -E -u jovyan /opt/conda/bin/python - <<'PY'
      import importlib.util
      import subprocess
      import sys

      packages = [
          ("prometheus_api_client", "prometheus_api_client"),
          ("jupyter_vre_workflow", "jupyter-vre-workflow==0.1.260"),
      ]
      missing = [package for module, package in packages if importlib.util.find_spec(module) is None]
      if missing:
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", *missing])
      PY

      # Create experiment logs directory
      mkdir -p /home/jovyan/experiment_logs
      chmod 777 /home/jovyan/experiment_logs

      if [ ! -d /home/jovyan/icenet-notebook ]; then
        git clone https://github.com/g-uva/egi-ice-net-example.git /home/jovyan/icenet-notebook
      fi
      if [ -d /home/jovyan/icenet-notebook ]; then
        chmod -R 777 /home/jovyan/icenet-notebook
      fi
      if [ -f /home/jovyan/icenet-notebook/install-dependencies.sh ]; then
        chmod +x /home/jovyan/icenet-notebook/install-dependencies.sh
      fi
      git config --global --add safe.directory /home/jovyan/icenet-notebook

      # Complete the example environment before accepting notebook requests.
      # Packages and the successful-install marker persist on the user's PVC.
      sudo -E -u jovyan /opt/conda/bin/python - <<'PYTHON'
      import hashlib
      import json
      import os
      from pathlib import Path
      import shutil
      import subprocess
      import sys

      if not (3, 9) <= sys.version_info[:2] < (3, 12):
          raise RuntimeError("The IceNet example requires Python 3.9–3.11")
      requirements = Path("/home/jovyan/icenet-notebook/requirements.txt")
      # Iris 3.11 uses string hashing removed in xxhash 4.
      compatibility = ["tensorflow-probability==0.23.0", "xxhash==3.8.1"]
      fingerprint = hashlib.sha256(
          requirements.read_bytes() + "\n".join(compatibility).encode() + sys.version.encode()
      ).hexdigest()
      marker = Path("/home/jovyan/.local/icenet-dependencies.sha256")
      check = (
          "import tensorflow, tensorflow_probability, icenet, xarray, netCDF4, cf_units, distributed; "
          "from icenet.data.sic.mask import Masks; "
          "from icenet.data.sic.osisaf import SICDownloader; "
          "from icenet.data.processors.era5 import IceNetERA5PreProcessor; "
          "from icenet.data.processors.meta import IceNetMetaPreProcessor; "
          "from icenet.data.processors.osi import IceNetOSIPreProcessor; "
          "from icenet.data.loaders import IceNetDataLoaderFactory; "
          "from icenet.data.dataset import IceNetDataSet; "
          "from icenet.model.train import train_model; "
          "from icenet.model.predict import predict_forecast; "
          "from icenet.plotting.video import xarray_to_video; "
          "from iris.common.metadata import hexdigest; hexdigest('compatibility-check')"
      )
      env = dict(os.environ, TF_CPP_MIN_LOG_LEVEL="2")
      ready = (
          marker.exists()
          and marker.read_text().strip() == fingerprint
          and subprocess.run([sys.executable, "-c", check], env=env).returncode == 0
      )
      if not ready:
          print("Installing IceNet notebook dependencies...", flush=True)
          subprocess.check_call([
              sys.executable, "-m", "pip", "install", "--user",
              "-r", str(requirements), *compatibility,
          ])
          subprocess.check_call([sys.executable, "-c", check], env=env)
          marker.write_text(fingerprint + "\n")
      print("IceNet notebook environment ready.", flush=True)

      # IPython shell commands do not raise on a failed export. Use a checked
      # subprocess so the experiment reports the original export failure.
      notebook = requirements.with_name("notebook.ipynb")
      document = json.loads(notebook.read_text())
      old_export = "!icenet_output -m -o ./results/predict custom_run_forecast api_dataset predict_dates.csv"
      new_export = (
          "import subprocess\n"
          "subprocess.run([\n"
          "    'icenet_output', '-m', '-o', './results/predict',\n"
          "    'custom_run_forecast', 'api_dataset', 'predict_dates.csv',\n"
          "], check=True)\n"
      )
      changed = False
      for cell in document["cells"]:
          if cell["cell_type"] == "code" and "".join(cell["source"]).strip() == old_export:
              cell["source"] = new_export.splitlines(keepends=True)
              cell["outputs"] = []
              cell["execution_count"] = None
              changed = True
      if changed:
          backup = notebook.with_name("notebook.before-checked-export.ipynb")
          if not backup.exists():
              shutil.copy2(notebook, backup)
          notebook.write_text(json.dumps(document, indent=1) + "\n")
      PYTHON

      if [ ! -d /home/jovyan/shashikant-notebook/ ] && [ -d /srv/shashikant-notebook/ ]; then
        mkdir -p /home/jovyan/
        cp -r /srv/shashikant-notebook/ /home/jovyan/shashikant-notebook
      fi

      echo "jovyan ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/jovyan && \
      chmod 0440 /etc/sudoers.d/jovyan

      exec start.sh jupyterhub-singleuser
  
  extraPodConfig:
    automountServiceAccountToken: true

  storage:
    type: dynamic
    homeMountPath: /home/jovyan
    # capacity: 5Gi
    # dynamic:
    #   storageClass: standard
    #   pvcNameTemplate: claim-{username}
    #   storageAccessModes:
    #     - ReadWriteOnce

    extraVolumes:
      - name: telemetry-installer
        configMap:
          name: telemetry-installer
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: starter-notebook
        configMap:
          name: starter-notebook
      - name: stress-notebook
        configMap:
          name: stress-notebook
      - name: track-notebook
        configMap:
          name: track-notebook
      # - name: shashikant-notebook-pvc
      #   persistentVolumeClaim:
      #     claimName: shashikant-notebook-pvc
      # - name: shashikant-notebook-example
      #   configMap:
      #     name: shashikant-notebook

    extraVolumeMounts:
      - name: telemetry-installer
        mountPath: /srv/telemetry-installer
        readOnly: true
      - name: sys
        mountPath: /sys
        readOnly: true
      - name: starter-notebook
        mountPath: /srv/starter-notebooks
        readOnly: true
      - name: stress-notebook
        mountPath: /srv/stress-notebook
        readOnly: true
      - name: track-notebook
        mountPath: /srv/track-notebook
        readOnly: true
      # - name: shashikant-notebook-pvc
      #   mountPath: /srv/shashikant-notebook
      #   readOnly: true
