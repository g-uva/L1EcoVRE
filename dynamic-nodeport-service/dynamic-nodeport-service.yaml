apiVersion: v1
kind: Service
metadata:
  name: prometheus-shashikant
  namespace: jhub
spec:
  type: NodePort
  selector:
    app: jupyterhub
    hub.jupyter.org/username: shashikant
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30000
